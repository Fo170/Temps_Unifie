; Projet exemple de la librairie Temps_Unifie (PlatformIO / VS Code)
;
; La librairie est à la racine du dépôt : src/Temps_Unifie.h + library.json.
; Chemins relatifs depuis exemple/ :
;   - ".."       -> racine du dépôt (librairie Temps_Unifie) via lib_extra_dirs
;   - "../../.." -> dossier partagé _INCLUDE_/Arduino/ (connexions.h, WiFi)
;
; Temps_Unifie est ESP32 uniquement (SNTP natif ESP-IDF).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_extra_dirs = ..
build_flags =
    -I ../../../
    -D_Maison_
