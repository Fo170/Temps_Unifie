sentence=Gestion du temps unifiée multi-pays pour ESP32 basée sur le SNTP natif de l'ESP-IDF.
paragraph=Epoch UTC, heure et date locales (fuseau POSIX et serveur NTP passés à TIME_Init, été/hiver automatiques), statut de synchronisation. Aucune dépendance externe (ni NTPClient, ni WiFiUdp, ni TimeLib) : l'horloge système est synchronisée par le SNTP natif lwIP démarré par configTzTime().
